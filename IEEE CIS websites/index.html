<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="CSS/TextSide.css" />
  </head>
  <body>
    <div class="BACKGROUND">
      <div class="blur" id="blur1"></div>

          <h1>
            WEB DEVELOPMENT <br />

              <p class="title">Time</p>
              <p>9:00 AM - 11:00 AM</p>
            </div>

            <div class="date DTbox">
              <p class="title">Date</p>
              <p>Nov, ?, 2025</p>

          </div>

          <div class="speaker DTbox">
            <div class="speaker_name">
              <p class="title">Speaker</p>
              <p>Anas Faraj</p>
            </div>

            <div class="speaker_pic">
              <img src="images/saul.jpg" alt="speaker" />

          <div class="about_the_workshop DTbox">
            <h2>About the Workshop</h2>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Magni
            commodi necessitatibus eos facere numquam illo. Repellendus, ipsum.
            Nam, earum eius!
          </div>

        </div>
        <div class="PICTURE">
          <img src="images/Layer2.png" alt="" id="Pic2" />
          <div class="cropper">
            <img src="images/Layer1.png" alt="" id="Pic1" />
          </div>
        </div>
      </section>
    </div>

</html>
